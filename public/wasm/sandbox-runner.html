<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LuantiHub PWA Sandbox Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #sandbox-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#luanti-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: crosshair;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.85;
    }
    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
    }
    #crosshair::before {
      top: 8px;
      left: 0;
      width: 18px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 8px;
      width: 2px;
      height: 18px;
    }
    #hotbar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .hotbar-slot {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(100, 116, 139, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .hotbar-slot.active {
      border-color: #38bdf8;
      background: rgba(14, 116, 144, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }
    .hotbar-slot img {
      width: 28px;
      height: 28px;
      image-rendering: pixelated;
      object-fit: contain;
    }
    .hotbar-slot .slot-swatch {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .hotbar-slot .slot-key {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
    }
    #selected-node-banner {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e0f2fe;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }
    #pointer-hint {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="sandbox-stage">
    <canvas id="luanti-canvas" tabindex="0"></canvas>
    <div id="crosshair"></div>
    <div id="pointer-hint">Click canvas to lock mouse (360° look) • WASD Move • Space/Shift Fly • Left/Right Click Break/Place</div>
    <div id="selected-node-banner">Loading Voxel Sandbox...</div>
    <div id="hotbar"></div>
  </div>
  <script src="/wasm/sandbox-runner.js"></script>
</body>
</html>
